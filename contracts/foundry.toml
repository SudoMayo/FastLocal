[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Monad execution rules (Foundry >= 1.8), per docs.monad.xyz
network = "monad"
# Verification settings from docs.monad.xyz (metadata_hash = "none" is bytecode_hash in Foundry)
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true

# Values from https://docs.monad.xyz/developer-essentials/testnets and /network-information
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"
